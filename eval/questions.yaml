# Test set for the text-to-SQL agent.
# Each question has a reference SQL query (gold_sql) whose result is the expected answer.
# Levels:
#   easy     -> answerable from the schema alone
#   business -> requires a business definition from the glossary
#   combined -> combines several business rules in one question

# ---------- EASY ----------

- id: 1
  level: easy
  question: How many sellers are on the marketplace?
  gold_sql: |
    SELECT COUNT(*) AS nb_sellers
    FROM sellers

- id: 2
  level: easy
  question: How many products are in the catalog?
  gold_sql: |
    SELECT COUNT(*) AS nb_products
    FROM products

- id: 3
  level: easy
  question: Which payment type is used most often?
  gold_sql: |
    SELECT payment_type
    FROM payments
    GROUP BY payment_type
    ORDER BY COUNT(*) DESC
    LIMIT 1

- id: 4
  level: easy
  question: How many distinct customers does Olist have?
  gold_sql: |
    SELECT COUNT(DISTINCT customer_unique_id) AS nb_customers
    FROM customers

- id: 5
  level: easy
  question: What is the average review score?
  gold_sql: |
    SELECT AVG(review_score) AS avg_score
    FROM reviews

- id: 6
  level: easy
  question: Which 5 states have the most customers, and how many customers does each have?
  gold_sql: |
    SELECT customer_state, COUNT(DISTINCT customer_unique_id) AS nb_customers
    FROM customers
    GROUP BY customer_state
    ORDER BY nb_customers DESC
    LIMIT 5

- id: 7
  level: easy
  question: How many different product categories are there?
  gold_sql: |
    SELECT COUNT(DISTINCT product_category_name) AS nb_categories
    FROM products

- id: 8
  level: easy
  question: What is the average number of installments for credit card payments?
  gold_sql: |
    SELECT AVG(payment_installments) AS avg_installments
    FROM payments
    WHERE payment_type = 'credit_card'

# ---------- BUSINESS ----------

- id: 9
  level: business
  question: What is the total revenue?
  gold_sql: |
    SELECT SUM(i.price) AS revenue
    FROM orders o
    JOIN order_items i ON o.order_id = i.order_id
    WHERE o.order_status = 'delivered'

- id: 10
  level: business
  question: What was the revenue in 2017?
  gold_sql: |
    SELECT SUM(i.price) AS revenue
    FROM orders o
    JOIN order_items i ON o.order_id = i.order_id
    WHERE o.order_status = 'delivered'
      AND YEAR(o.order_purchase_timestamp) = 2017

- id: 11
  level: business
  question: What is the average order value?
  gold_sql: |
    SELECT SUM(i.price) / COUNT(DISTINCT o.order_id) AS average_order_value
    FROM orders o
    JOIN order_items i ON o.order_id = i.order_id
    WHERE o.order_status = 'delivered'

- id: 12
  level: business
  question: How many orders have been placed?
  gold_sql: |
    SELECT COUNT(DISTINCT order_id) AS nb_orders
    FROM orders
    WHERE order_status NOT IN ('canceled', 'unavailable')

- id: 13
  level: business
  question: What is the repeat purchase rate?
  gold_sql: |
    WITH orders_per_customer AS (
        SELECT c.customer_unique_id, COUNT(DISTINCT o.order_id) AS nb_orders
        FROM orders o
        JOIN customers c ON o.customer_id = c.customer_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
        GROUP BY c.customer_unique_id
    )
    SELECT AVG(CASE WHEN nb_orders >= 2 THEN 1.0 ELSE 0.0 END) AS repeat_purchase_rate
    FROM orders_per_customer

- id: 14
  level: business
  question: What share of delivered orders arrived late?
  gold_sql: |
    SELECT AVG(CASE WHEN CAST(order_delivered_customer_date AS DATE)
                       > CAST(order_estimated_delivery_date AS DATE)
                    THEN 1.0 ELSE 0.0 END) AS late_delivery_rate
    FROM orders
    WHERE order_status = 'delivered'
      AND order_delivered_customer_date IS NOT NULL

- id: 15
  level: business
  question: What is the median delivery time in days?
  gold_sql: |
    SELECT MEDIAN(DATE_DIFF('day', order_purchase_timestamp, order_delivered_customer_date)) AS median_delivery_days
    FROM orders
    WHERE order_status = 'delivered'
      AND order_delivered_customer_date IS NOT NULL

- id: 16
  level: business
  question: What percentage of reviews are negative?
  gold_sql: |
    SELECT AVG(CASE WHEN review_score <= 2 THEN 1.0 ELSE 0.0 END) AS negative_review_rate
    FROM reviews

- id: 17
  level: business
  question: What is the revenue generated by customers in the South region?
  gold_sql: |
    SELECT SUM(i.price) AS revenue
    FROM orders o
    JOIN order_items i ON o.order_id = i.order_id
    JOIN customers c ON o.customer_id = c.customer_id
    WHERE o.order_status = 'delivered'
      AND c.customer_state IN ('PR', 'SC', 'RS')

- id: 18
  level: business
  question: How many orders were placed last month?
  gold_sql: |
    WITH latest_month AS (
        SELECT DATE_TRUNC('month', MAX(order_purchase_timestamp)) AS month FROM orders
    )
    SELECT COUNT(DISTINCT o.order_id) AS nb_orders
    FROM orders o, latest_month m
    WHERE DATE_TRUNC('month', o.order_purchase_timestamp) = m.month
      AND o.order_status NOT IN ('canceled', 'unavailable')

- id: 19
  level: business
  question: What are the top 5 product categories by revenue?
  gold_sql: |
    SELECT COALESCE(t.product_category_name_english, p.product_category_name) AS category,
           SUM(i.price) AS revenue
    FROM orders o
    JOIN order_items i ON o.order_id = i.order_id
    JOIN products p ON i.product_id = p.product_id
    LEFT JOIN category_translation t ON p.product_category_name = t.product_category_name
    WHERE o.order_status = 'delivered'
    GROUP BY category
    ORDER BY revenue DESC
    LIMIT 5

- id: 20
  level: business
  question: What is the average order value for customers in the state of São Paulo?
  gold_sql: |
    SELECT SUM(i.price) / COUNT(DISTINCT o.order_id) AS average_order_value
    FROM orders o
    JOIN order_items i ON o.order_id = i.order_id
    JOIN customers c ON o.customer_id = c.customer_id
    WHERE o.order_status = 'delivered'
      AND c.customer_state = 'SP'

# ---------- COMBINED ----------

- id: 21
  level: combined
  question: What is the late delivery rate in the Northeast region?
  gold_sql: |
    SELECT AVG(CASE WHEN CAST(o.order_delivered_customer_date AS DATE)
                       > CAST(o.order_estimated_delivery_date AS DATE)
                    THEN 1.0 ELSE 0.0 END) AS late_delivery_rate
    FROM orders o
    JOIN customers c ON o.customer_id = c.customer_id
    WHERE o.order_status = 'delivered'
      AND o.order_delivered_customer_date IS NOT NULL
      AND c.customer_state IN ('MA', 'PI', 'CE', 'RN', 'PB', 'PE', 'AL', 'SE', 'BA')

- id: 22
  level: combined
  question: Which customer state has the highest late delivery rate, and what is that rate?
  gold_sql: |
    SELECT c.customer_state,
           AVG(CASE WHEN CAST(o.order_delivered_customer_date AS DATE)
                       > CAST(o.order_estimated_delivery_date AS DATE)
                    THEN 1.0 ELSE 0.0 END) AS late_delivery_rate
    FROM orders o
    JOIN customers c ON o.customer_id = c.customer_id
    WHERE o.order_status = 'delivered'
      AND o.order_delivered_customer_date IS NOT NULL
    GROUP BY c.customer_state
    ORDER BY late_delivery_rate DESC
    LIMIT 1

- id: 23
  level: combined
  question: What share of delivered orders containing at least one health_beauty product arrived late?
  gold_sql: |
    SELECT AVG(CASE WHEN CAST(o.order_delivered_customer_date AS DATE)
                       > CAST(o.order_estimated_delivery_date AS DATE)
                    THEN 1.0 ELSE 0.0 END) AS late_delivery_rate
    FROM orders o
    WHERE o.order_status = 'delivered'
      AND o.order_delivered_customer_date IS NOT NULL
      AND o.order_id IN (
          SELECT i.order_id
          FROM order_items i
          JOIN products p ON i.product_id = p.product_id
          JOIN category_translation t ON p.product_category_name = t.product_category_name
          WHERE t.product_category_name_english = 'health_beauty'
      )

- id: 24
  level: combined
  question: What is the average review score of orders that were delivered late?
  gold_sql: |
    SELECT AVG(r.review_score) AS avg_score
    FROM orders o
    JOIN reviews r ON o.order_id = r.order_id
    WHERE o.order_status = 'delivered'
      AND o.order_delivered_customer_date IS NOT NULL
      AND CAST(o.order_delivered_customer_date AS DATE) > CAST(o.order_estimated_delivery_date AS DATE)

- id: 25
  level: combined
  question: Among product categories with at least 100 reviews, which 5 have the highest negative review rate?
  gold_sql: |
    SELECT COALESCE(t.product_category_name_english, p.product_category_name) AS category,
           AVG(CASE WHEN r.review_score <= 2 THEN 1.0 ELSE 0.0 END) AS negative_review_rate
    FROM reviews r
    JOIN order_items i ON r.order_id = i.order_id
    JOIN products p ON i.product_id = p.product_id
    LEFT JOIN category_translation t ON p.product_category_name = t.product_category_name
    GROUP BY category
    HAVING COUNT(*) >= 100
    ORDER BY negative_review_rate DESC
    LIMIT 5

- id: 26
  level: combined
  question: What was the revenue in March 2018?
  gold_sql: |
    SELECT SUM(i.price) AS revenue
    FROM orders o
    JOIN order_items i ON o.order_id = i.order_id
    WHERE o.order_status = 'delivered'
      AND o.order_purchase_timestamp >= '2018-03-01'
      AND o.order_purchase_timestamp < '2018-04-01'

- id: 27
  level: combined
  question: How many customers in the South region have ordered more than once?
  gold_sql: |
    WITH orders_per_customer AS (
        SELECT c.customer_unique_id, COUNT(DISTINCT o.order_id) AS nb_orders
        FROM orders o
        JOIN customers c ON o.customer_id = c.customer_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
          AND c.customer_state IN ('PR', 'SC', 'RS')
        GROUP BY c.customer_unique_id
    )
    SELECT COUNT(*) AS nb_repeat_customers
    FROM orders_per_customer
    WHERE nb_orders >= 2

- id: 28
  level: combined
  question: What is the average delivery time in days for customers in the North region?
  gold_sql: |
    SELECT AVG(DATE_DIFF('day', o.order_purchase_timestamp, o.order_delivered_customer_date)) AS avg_delivery_days
    FROM orders o
    JOIN customers c ON o.customer_id = c.customer_id
    WHERE o.order_status = 'delivered'
      AND o.order_delivered_customer_date IS NOT NULL
      AND c.customer_state IN ('AM', 'RR', 'AP', 'PA', 'TO', 'RO', 'AC')

- id: 29
  level: combined
  question: What was the revenue of the health_beauty category in 2018?
  gold_sql: |
    SELECT SUM(i.price) AS revenue
    FROM orders o
    JOIN order_items i ON o.order_id = i.order_id
    JOIN products p ON i.product_id = p.product_id
    JOIN category_translation t ON p.product_category_name = t.product_category_name
    WHERE o.order_status = 'delivered'
      AND t.product_category_name_english = 'health_beauty'
      AND YEAR(o.order_purchase_timestamp) = 2018

- id: 30
  level: combined
  question: Which seller state generates the most revenue?
  gold_sql: |
    SELECT s.seller_state
    FROM orders o
    JOIN order_items i ON o.order_id = i.order_id
    JOIN sellers s ON i.seller_id = s.seller_id
    WHERE o.order_status = 'delivered'
    GROUP BY s.seller_state
    ORDER BY SUM(i.price) DESC
    LIMIT 1
